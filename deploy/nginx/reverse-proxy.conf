# Example nginx config for the reverse proxy host.
# Replace: edu.example.com — your domain, 192.0.2.10 — internal address of the application host.
# Put into /etc/nginx/sites-available/ and enable with a symlink in sites-enabled/.

upstream edu_isr_app {
    server 192.0.2.10:3001;
    keepalive 16;
}

# HTTP: Let's Encrypt challenges and redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name edu.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edu.example.com;

    ssl_certificate     /etc/letsencrypt/live/edu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edu.example.com/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://edu_isr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app trusts exactly one proxy (TRUST_PROXY_HOPS=1) and takes the last address
        # from this header, so a client cannot spoof its IP for rate limiting
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
