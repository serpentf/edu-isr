# Step 1 before the first certificate exists: HTTP only, to pass the Let's Encrypt challenge.
# After `certbot certonly --webroot` succeeds, replace it with reverse-proxy.conf.
server {
    listen 80;
    listen [::]:80;
    server_name edu.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}
